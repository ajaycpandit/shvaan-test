<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shvaan Pet Care - Calculator</title>
  <link rel="stylesheet" href="site.css">
  <style>
    body { background: var(--cream); color: var(--ink); font-family: 'DM Sans', sans-serif; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    .card { background: white; border-radius: 8px; padding: 24px; margin: 16px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .sec-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-faint); margin: 16px 0 12px; }
    .fd { margin-bottom: 14px; }
    .fd label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .fd input, .fd select { width: 100%; height: 46px; padding: 0 13px; border: 1.5px solid var(--cream-dark); border-radius: 4px; background: white; color: var(--ink); font-size: 14px; font-family: 'DM Sans', sans-serif; outline: none; }
    .fd input:focus, .fd select:focus { border-color: var(--brown); }
    .btn { background: var(--brown); color: white; border: none; border-radius: 4px; padding: 12px 24px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: var(--brown-dark); }
    .result-line { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--cream); font-size: 14px; }
    .result-line.total { font-weight: 700; font-size: 16px; border-bottom: none; padding-top: 14px; margin-top: 6px; }
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    #res { display: none; margin-top: 16px; }
    #prev { display: none; color: var(--ink-faint); font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>🐾 Boarding Cost Calculator</h2>
      <p style="color: var(--ink-faint); font-size: 13px;">Calculate the cost for your dog's stay</p>
    </div>

    <div class="card">
      <div class="sec-title">Service & Dates</div>
      <div class="g2">
        <div class="fd">
          <label>Service Type</label>
          <select id="svc" style="height:46px;padding:0 13px;border:1.5px solid var(--cream-dark);border-radius:4px;background:white;color:var(--ink);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;cursor:pointer;">
            <option value="boarding">Boarding (24hr)</option>
            <option value="daycare">Day Care (per visit)</option>
          </select>
        </div>
        <div class="fd">
          <label>Check-In Date</label>
          <input type="date" id="ci">
        </div>
      </div>
      <div class="g2">
        <div class="fd">
          <label>Check-In Time</label>
          <input type="time" id="cit" value="10:00">
        </div>
        <div class="fd">
          <label>Check-Out Date</label>
          <input type="date" id="co">
        </div>
      </div>
      <div class="g2">
        <div class="fd">
          <label>Check-Out Time</label>
          <input type="time" id="cot" value="10:00">
        </div>
      </div>
    </div>

    <div class="card">
      <div class="sec-title">Rates (adjustable)</div>
      <div class="g2">
        <div class="fd">
          <label>Boarding Rate ($/day)</label>
          <input type="number" id="rate-b" value="75" step="1">
        </div>
        <div class="fd">
          <label>Day Care Rate ($/visit)</label>
          <input type="number" id="rate-d" value="45" step="1">
        </div>
      </div>

      <div class="sec-title">Grace Period & Surcharge</div>
      <div class="g2">
        <div class="fd">
          <label>Grace Period (hours after 24h)</label>
          <input type="number" id="grace" value="3" step="0.5">
        </div>
        <div class="fd">
          <label>Surcharge Type</label>
          <select id="stype" style="height:46px;padding:0 13px;border:1.5px solid var(--cream-dark);border-radius:4px;background:white;color:var(--ink);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;cursor:pointer;">
            <option value="fixed">Fixed Amount</option>
            <option value="percent">Percentage of Daily Rate</option>
          </select>
        </div>
      </div>
      <div class="g2">
        <div class="fd" id="surch-fixed-wrap">
          <label>Surcharge Amount ($)</label>
          <input type="number" id="surch" value="25" step="1">
        </div>
        <div class="fd" id="surch-pct-wrap" style="display:none;">
          <label>Surcharge (% of daily rate)</label>
          <input type="number" id="surch-pct" value="50" step="1" min="0" max="100">
        </div>
      </div>

      <div class="sec-title">Weekend rates</div>
      <div class="fd">
        <label>Weekend multiplier (1.0 = same as weekday, 1.15 = 15% higher)</label>
        <input type="number" id="weekend-mult" value="1.15" step="0.01" min="1.0">
      </div>
    </div>

    <div class="card">
      <button class="btn" onclick="calculate()" style="width:100%;">📊 Calculate Cost</button>
      <div id="prev" style="margin-top:14px;"></div>
    </div>

    <div id="res" class="card">
      <h3 style="margin-top:0;">💰 Cost Breakdown</h3>
      <div id="res-content"></div>
    </div>
  </div>

  <script>
    // FIXED CALCULATION LOGIC
    function calcStay(ratePerDay, checkinDt, checkoutDt, graceHours, surchType, surchAmount, surchPct, weekendMultiplier) {
      weekendMultiplier = weekendMultiplier || 1.0;
      const ms = checkoutDt - checkinDt;
      const hrs = ms / 3600000;
      const fullDays = Math.floor(hrs / 24);
      const rem = hrs % 24;
      
      // Always bill minimum 1 day
      const billedDays = Math.max(1, fullDays);
      
      // Count weekend days (Sat=6, Sun=0)
      let weekendDays = 0, currentDay = new Date(checkinDt);
      for (let i = 0; i < billedDays; i++) {
        const dow = currentDay.getDay();
        if (dow === 0 || dow === 6) weekendDays++;
        currentDay.setDate(currentDay.getDate() + 1);
      }
      const weekdayDays = billedDays - weekendDays;
      const subtotal = weekdayDays * ratePerDay + weekendDays * ratePerDay * weekendMultiplier;
      
      // FIX: Surcharge logic - only if extra hours exceed grace period on full days
      let surcharge = 0;
      if (fullDays >= 1 && rem > graceHours) {
        // Extra hours beyond grace period warrant a surcharge
        if (surchType === 'fixed') {
          surcharge = surchAmount;
        } else {
          surcharge = ratePerDay * surchPct / 100;
        }
      }
      
      return {
        fullDays,
        extraHrs: Math.round(rem),
        billedDays,
        weekendDays,
        weekdayDays,
        subtotal,
        surcharge,
        total: subtotal + surcharge,
        rate: ratePerDay,
        weekendRate: ratePerDay * weekendMultiplier
      };
    }

    function getSettings() {
      const disc = parseFloat(document.getElementById('group-discount').value) || 0;
      return {
        rateBoarding: parseFloat(document.getElementById('rate-b').value) || 75,
        rateDaycare: parseFloat(document.getElementById('rate-d').value) || 45,
        graceHours: parseFloat(document.getElementById('grace').value) || 3,
        surchType: document.getElementById('stype').value || 'fixed',
        surchAmount: parseFloat(document.getElementById('surch').value) || 25,
        surchPct: parseFloat(document.getElementById('surch-pct').value) || 50,
        weekendMult: parseFloat(document.getElementById('weekend-mult').value) || 1.15,
        numDogs: 1,
        groupDiscount: 0
      };
    }

    function calculate() {
      const svc = document.getElementById('svc').value;
      const ciStr = document.getElementById('ci').value;
      const citStr = document.getElementById('cit').value;
      const coStr = document.getElementById('co').value;
      const cotStr = document.getElementById('cot').value;

      if (!ciStr || !coStr) {
        alert('Please enter check-in and check-out dates');
        return;
      }

      const inDt = new Date(ciStr + 'T' + citStr);
      const outDt = new Date(coStr + 'T' + cotStr);

      if (outDt <= inDt) {
        alert('Check-out must be after check-in');
        return;
      }

      const s = getSettings();
      const rate = svc === 'boarding' ? s.rateBoarding : s.rateDaycare;
      const calc = calcStay(rate, inDt, outDt, s.graceHours, s.surchType, s.surchAmount, s.surchPct, s.weekendMult);

      const prev = document.getElementById('prev');
      const res = document.getElementById('res');
      const resContent = document.getElementById('res-content');

      prev.style.display = 'none';
      res.style.display = 'block';

      let html = `<div class="result-line"><span>Duration</span><span>${calc.billedDays}d${calc.extraHrs > 0 ? ' + ' + calc.extraHrs + 'h' : ''}</span></div>`;
      
      if (svc === 'boarding') {
        html += `<div class="result-line"><span>Weekdays</span><span>${calc.weekdayDays}d @ $${rate.toFixed(2)}</span></div>`;
        if (calc.weekendDays > 0) html += `<div class="result-line"><span>Weekends</span><span>${calc.weekendDays}d @ $${calc.weekendRate.toFixed(2)}</span></div>`;
      }

      html += `<div class="result-line"><span>Base cost</span><span>$${calc.subtotal.toFixed(2)}</span></div>`;

      // FIX: Show surcharge clearly
      if (calc.surcharge > 0) {
        const lbl = s.surchType === 'fixed' ? 'Late checkout fee' : s.surchPct + '% surcharge';
        html += `<div class="result-line"><span>${lbl}</span><span style="color:var(--brown-dark);font-weight:600;">+$${calc.surcharge.toFixed(2)}</span></div>`;
      } else if (calc.fullDays >= 1 && calc.extraHrs > 0) {
        html += `<div class="result-line"><span>Extra hours (within grace period)</span><span style="color:var(--ink-faint);">No charge (${calc.extraHrs}h ≤ ${s.graceHours}h grace)</span></div>`;
      }

      html += `<div class="result-line total"><span>Total</span><span>$${calc.total.toFixed(2)}</span></div>`;

      resContent.innerHTML = html;
    }

    // Handle surcharge type toggle
    document.getElementById('stype').addEventListener('change', function() {
      const isFixed = this.value === 'fixed';
      document.getElementById('surch-fixed-wrap').style.display = isFixed ? '' : 'none';
      document.getElementById('surch-pct-wrap').style.display = isFixed ? 'none' : '';
    });

    // Auto-calculate on any input change
    ['ci', 'cit', 'co', 'cot', 'rate-b', 'rate-d', 'grace', 'stype', 'surch', 'surch-pct', 'weekend-mult', 'svc'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('change', calculate);
        el.addEventListener('input', calculate);
      }
    });

    // Set today as default
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('ci').value = today;
    document.getElementById('co').value = today;
  </script>
</body>
</html>
